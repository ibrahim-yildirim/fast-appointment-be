spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: fast-appointment-be
  messages:
    fallback-to-system-locale: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true